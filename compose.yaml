name: open-task-mvp
services:
  db:
    image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: open_task
      POSTGRES_USER: open_task
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-open-task-local-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_task -d open_task"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  database:
