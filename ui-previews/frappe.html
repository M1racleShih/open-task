<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>open-task · 任务 IDE</title><link rel="stylesheet" href="frappe.css"></head><body>
<div id="app"></div><div id="toast" role="status" hidden></div>
<dialog id="note-dialog"><form id="note-form"><header><h2 id="note-title">记录跟进</h2><button type="button" data-dismiss aria-label="关闭">×</button></header><p id="note-context"></p><label for="note">说明</label><textarea id="note" rows="4" required placeholder="写下下一步安排…"></textarea><div id="date-field"><label for="next-date">下次反馈</label><input type="datetime-local" id="next-date" value="2026-09-10T18:00"></div><footer><span>仅保存为本页示例</span><button class="primary">保存记录</button></footer></form></dialog>
<dialog id="create-dialog" aria-labelledby="create-heading"></dialog>
<script src="frappe.js"></script></body></html>
